name: Refresh and deploy
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: labeler-refresh-and-pages
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: .state
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Collect with the actual workflow credential
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LABELER_READ_TOKEN || github.token }}
        run: uv run labeler-dashboard refresh --max-requests 4000
      - name: Persist evidence before building
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C .state config user.name "github-actions[bot]"
          git -C .state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .state add -- state.json
          if ! git -C .state diff --cached --quiet; then
            git -C .state commit -m "Refresh labeler evidence"
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
              git -C .state push origin HEAD:data
          fi
      - name: Build from persisted snapshot
        run: uv run labeler-dashboard render
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Surface incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection did not complete successfully. The deployed dashboard reports persisted gaps. Check source-read preflight and collector errors."
          exit 1
