[project]
name = "labeler-dashboard"
version = "0.1.0"
description = "Read-only, evidence-based monitoring of the .NET issue labeler"
requires-python = ">=3.12"
dependencies = ["requests>=2.32.3,<3"]

[project.scripts]
labeler-dashboard = "labeler_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "playwright>=1.56,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
